<!--
la etiqueta <head> se utiliza para contener información sobre el documento HTML, como el título, 
los metadatos y los enlaces a recursos externos.

la etiqueta <base> se utiliza para especificar la URL base para todas las URL 
relativas en un documento HTML. Esto significa que si tienes enlaces o recursos 
(como imágenes, hojas de estilo, scripts) que utilizan rutas relativas, el 
navegador los interpretará en relación con la URL base especificada.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <base href="https://www.ejemplo.com/">

    <!--Estilos de la barra de navegación-->
    <style>
        .navbar {
            background-color: #56b3e9;
            text-align: center;
            border-radius: 10px;
            padding: 10px;
            margin: 10px;
        }
        a {
            margin-right: 10px;
        }

    </style>
</head>
<body>
    <div class="navbar">
        <a href="index">Home</a>
        <a href="about">About</a>
        <a href="contact">Contact</a>
    </div>
    
</body>
</html>
