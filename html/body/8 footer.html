<!--
la etiqueta <footer> se utiliza para definir un pie de página para un documento o una sección, 
que generalmente contiene información de contacto, derechos de autor, enlaces a políticas de privacidad 
y otros elementos relacionados con el contenido del documento.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>Encabezado de la página</h1>
    </header>
    <article>
        <h2>Artículo principal</h2>
        <p>Este es el contenido principal del artículo.</p>
    </article>
    <aside>
        <h3>Contenido relacionado</h3>
    </aside>
    <footer style="background-color: #7cee59; padding: 20px; text-align: center;">
        <p>&copy; 2024 Mi Sitio Web. Todos los derechos reservados.</p>
    </footer>
</body>
</html>S
