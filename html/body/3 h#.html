<!--
la etiqueta <body> se utiliza para contener el contenido principal de un documento HTML, como texto, 
imágenes, videos, enlaces y otros elementos que se muestran en la página web.

la etiqueta <h1> a <h6> se utilizan para definir encabezados de diferentes niveles en un documento HTML.

la etiqueta <hgroup> se utiliza para agrupar encabezados de diferentes niveles en un documento HTML, 
lo que permite una mejor organización y estructura del contenido.

la etiqueta <p> se utiliza para definir un párrafo de texto en un documento HTML, lo que permite
una mejor legibilidad y organización del contenido.
-->
    
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <hgroup style="background-color: #7cee59; padding: 5px;">
        <h1>Encabezado principal</h1> <!--mas importante-->
        <p>Tu camino para convertirte en desarrollador</p>
    </hgroup>

    <h2>Subencabezado</h2>
    <h3>Subsubencabezado</h3>
    <h4>Encabezado de nivel 4</h4>
    <h5>Encabezado de nivel 5</h5>
    <h6>Encabezado de nivel 6</h6> <!--menos importante-->
</body>
</html>
