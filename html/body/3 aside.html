<!--
la etiqueta <aside> se utiliza para definir un contenido secundario, como un menú de navegación, 
un panel de anuncios o cualquier otro contenido que no sea parte principal del contenido del documento.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>Encabezado de la página</h1>
    </header>
    <aside style="background-color: #7cee59; padding: 20px;">
        <h3>Contenido relacionado</h3>
        <ul>
            <li><a href="#">Aprender CSS</a></li>
            <li><a href="#">Aprender JavaScript</a></li>
            <li><a href="#">Crear tu primera página web</a></li>
        </ul>
    </aside>
</body>
</html>
