<!--
Estructura Básica
Es el "esqueleto" mínimo que necesita cualquier documento HTML para que el navegador web (como Chrome, 
Firefox o Edge) entienda cómo debe interpretarlo y mostrarlo.

Una estructura básica incluye elementos esenciales como
la etiqueta <body> se utiliza para contener el contenido principal de un documento HTML, como texto, 
imágenes, videos, enlaces y otros elementos que se muestran en la página web.

la etiqueta <div> se utiliza para agrupar y organizar contenido en un documento HTML, lo que permite una 
mejor estructura y diseño de la página web.

bloque secuencial de elementos, donde cada elemento se muestra uno debajo del otro, ocupando todo el ancho disponible
-->
    
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        Titulo de la página
        <div>
            articulo 1
            <div>
                texto del articulo 1
            </div>
        </div>
        <div>
            articulo 2  
            <div>   
                texto del articulo 2
            </div>
        </div>
    </div>
</body>
</html>
