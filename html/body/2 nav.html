<!--
la etiqueta <nav> se utiliza para definir un conjunto de enlaces de navegación en un documento HTML,
tabla de contenido, menú de navegación, barra de navegación, etc.

la etiqueta <ul> se utiliza para crear una lista desordenada en un documento HTML, lo que permite
organizar y presentar elementos de manera estructurada y legible.

la etiqueta <li> se utiliza para definir un elemento de lista en un documento HTML, lo que permite
presentar información de manera organizada y estructurada dentro de una lista, ya sea ordenada o desordenada.

la etiqueta <a> se utiliza para crear un enlace en un documento HTML, lo que permite
a los usuarios navegar a otras páginas web, secciones del mismo documento o recursos externos al hacer clic en el enlace.
href="#top" redirige a la parte superior de la página actual, mientras que href="#section" redirige a una sección específica de la misma página.
href="#" mantiene la pagina actual, no se mueve a otra pagina, ni a otra seccion de la misma pagina.

-->
    
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="#">Actual</a></li>
                <li><a href="#inicio" target="_blank">Inicio</a></li>
                <li><a href="#servicios">Servicios</a></li>
                <li><a href="#nosotros">Nosotros</a></li>
                <li><a href="#contacto">Contacto</a></li>
                <li><a href="mailto:nowhere@mozilla.org">Send email to nowhere</a></li>
            </ul>
        </nav>
    </header>
</body>
</html>
