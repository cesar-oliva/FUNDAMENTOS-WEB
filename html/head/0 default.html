<!--
la etiqueta Doctype se utiliza para declarar el tipo de documento y la versión de HTML que se está utilizando.

la etiqueta <html> es el contenedor principal de un documento HTML y define el inicio y el final del 
mismo.

la etiqueta <head> se utiliza para contener información sobre el documento HTML, como el título, 
los metadatos y los enlaces a recursos externos.

la etiqueta <meta> se utiliza para proporcionar metadatos sobre el documento HTML, como la codificación 
de caracteres, la descripción, las palabras clave y la configuración de la ventana gráfica. 
Estos metadatos ayudan a los motores de búsqueda y a los navegadores a comprender mejor el contenido y 
la estructura del documento.

la etiqueta <title> se utiliza para definir el título del documento HTML. El contenido de esta etiqueta 
se muestra en la barra de título del navegador o en la pestaña del navegador cuando se visualiza la 
página web.

la etiqueta <body> se utiliza para contener el contenido principal de un documento HTML, como texto, 
imágenes, videos, enlaces y otros elementos que se muestran en la página web.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--
    #atributos
    - name: Especifica el nombre del metadato.
    - content: Proporciona el valor del metadato.
    - media: Define el tipo de medio al que se aplica el metadato, como "screen" o "print".
    - charset: Define la codificación de caracteres utilizada en el documento.
    - http-equiv: Permite establecer encabezados HTTP equivalentes, como la configuración de la caché 
    o la redirección.
    - itemprop: Se utiliza para asociar metadatos con elementos específicos del documento, como el título,
    la descripción o la imagen.
    - property: Se utiliza para definir propiedades de metadatos personalizadas, como Open Graph.
    #e.j.
    <meta
        name="description"
        content="La referencia de HTML describe todos los elementos y atributos de HTML, incluidos los atributos globales 
        que se aplican a todos los elementos." />
    <meta http-equiv="refresh" content="3;url=https://www.mozilla.org" />
    -->
    <title>Document</title>
</head>
<body>
    
</body>
</html>
