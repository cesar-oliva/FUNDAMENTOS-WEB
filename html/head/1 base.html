<!--
la etiqueta <base> se utiliza para especificar la URL base para todas las URL 
relativas en un documento HTML. Esto significa que si tienes enlaces o recursos 
(como imágenes, hojas de estilo, scripts) que utilizan rutas relativas, el 
navegador los interpretará en relación con la URL base especificada.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <base href="https://www.ejemplo.com/" target="_blank">
    <!--
    #atributos
    - href: Especifica la URL base para todas las URL relativas en el documento.
    - target: Especifica el destino predeterminado para todos los enlaces en el documento
        #palabras clave
        - _blank: Abre el enlace en una nueva ventana o pestaña.
        - _self: Abre el enlace en la misma ventana o pestaña (comportamiento predeterminado).
        - _parent: Abre el enlace en la ventana principal (si hay una).
        - _top: Abre el enlace en la ventana superior (si hay una).
    #e.j.
    <base href="http://www.example.com/page.html" />
    <base target="_blank" href="http://www.example.com/page.html" />
    -->
</head>
<body>
    <div class="navbar">
        <a href="index">Home</a>
        <a href="about">About</a>
        <a href="contact">Contact</a>
    </div>
</body>
</html>
