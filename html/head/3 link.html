<!--
la etiqueta <link> se utiliza para enlazar recursos externos, como hojas de estilo CSS, fuentes o iconos, 
al documento HTML. Esto permite que el navegador cargue y aplique estos recursos al contenido del documento.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!--Estilos externos-->
    <link rel="stylesheet" href="../../css/head.css">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <!--
    #atributos
    - as: Especifica la relación entre el documento actual y el recurso enlazado, como "stylesheet" para hojas de estilo.
        #palabras clave
        - fetch: Indica que el recurso enlazado debe ser recuperado y procesado por el navegador.
        - font: Indica que el recurso enlazado es una fuente tipográfica.
        - image: Indica que el recurso enlazado es una imagen.
        - js: Indica que el recurso enlazado es un script JavaScript.
    - crossorigin: Indica si se deben enviar credenciales (como cookies) al solicitar el recurso, con valores como "anonymous" o "use-credentials".
    - href: Especifica la URL del recurso externo que se va a enlazar.
    - hreflang: Indica el idioma del recurso enlazado, como "en" para inglés o "es" para español.
    - media: Define el tipo de medio al que se aplica el recurso enlazado, como "screen" o "print".
    - referrerpolicy: Controla cómo se envía la información de referencia al solicitar el recurso, con valores como "no-referrer" o "origin".
    - rel: Especifica la relación entre el documento actual y el recurso enlazado
        #palabras clave
        - stylesheet: Indica que el recurso enlazado es una hoja de estilo CSS.
        - icon: Indica que el recurso enlazado es un icono para la página
        - preload: Indica que el recurso enlazado debe cargarse antes de que se procese el documento.
    - sizes: Indica el tamaño de los iconos enlazados, como "16x16" o "32x32".
    - bloquing: Indica si el recurso enlazado debe bloquear la carga del documento hasta que se haya cargado, con valores como "render" o "script".
    - disabled: Indica si el recurso enlazado está deshabilitado y no se debe aplicar al documento.
    - title: Proporciona un título para el recurso enlazado, que puede ser útil para la documentación o la organización del código.
    - type: Especifica el tipo de contenido del recurso enlazado, como "text/css" para hojas de estilo.
    #e.j.
    <link
        rel="preload"
        href="myFont.woff2"
        as="font"
        type="font/woff2"
        crossorigin="anonymous" />
    -->

</head>
<body>
    <div class="container">
        <h1>Bienvenido a mi sitio web</h1>
        <div class="alert alert-primary" role="alert">
            A simple primary alert—check it out!
        </div>
    </div>
</body>
</html>
