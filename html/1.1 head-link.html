<!--
la etiqueta <head> se utiliza para contener información sobre el documento HTML, como el título, 
los metadatos y los enlaces a recursos externos.

la etiqueta <link> se utiliza para enlazar recursos externos, como hojas de estilo CSS, fuentes o iconos, 
al documento HTML. Esto permite que el navegador cargue y aplique estos recursos al contenido del documento.

la etiqueta <script> se utiliza para incluir código JavaScript en un documento HTML. Esto permite agregar interactividad,
dinamismo y funcionalidad a la página web, como validación de formularios, anim|aciones, efectos visuales y comunicación 
con servidores web.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!--Estilos embedidos-->
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        h1 {
            color: red;
        }
    </style> <!--esilos css-->
    <script></script> <!--scripts js-->

    <!--Estilos externos-->
    <link rel="stylesheet" href="styles.css">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">


</head>
<body>
    <div class="container">
        <h1>Bienvenido a mi sitio web</h1>
        <div class="alert alert-primary" role="alert">
            A simple primary alert—check it out!
        </div>
   
    </div>
</body>
</html>
