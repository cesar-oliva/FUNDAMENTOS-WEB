<!--
la etiqueta <body> se utiliza para contener el contenido principal de un documento HTML, como texto, 
imágenes, videos, enlaces y otros elementos que se muestran en la página web.

la etiqueta <main> se utiliza para definir el contenido principal de un documento HTML, que es único 
y relevante para el tema central del documento.
-->
    
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>Encabezado de la página</h1>
        <nav>
            <ul>
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Acerca de</a></li>
                <li><a href="#">Contacto</a></li>
            </ul>
        </nav>
    </header>
    <main style="background-color: #eca073; padding: 5px;"> 
        <h1>Contenido principal</h1>
        <p>Este es el contenido principal de la página web.</p>
    </main>
    <footer>
        <p>Derechos de autor &copy; 2023</p>
    </footer>
</body>
</html>
