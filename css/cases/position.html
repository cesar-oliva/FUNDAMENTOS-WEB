<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<div>>, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 
        La propiedad position de CSS especifica cómo un elemento es posicionado 
        en el documento. Las propiedades top, right, bottom, y left determinan 
        la ubicación final de los elementos posicionados.
        #valores
            static: Es el valor por defecto. Los elementos se posicionan según el flujo normal del documento.-
            relative: Los elementos se posicionan según el flujo normal del documento, pero pueden ser desplazados respecto a su posición original.
            absolute: Los elementos se posicionan de forma absoluta en relación con su ancestro posicionado más cercano.
            fixed: Los elementos se posicionan de forma fija en relación con la ventana del navegador.
        */
        .container {
            display: inline-block; /*posiciona el contenedor en línea con otros elementos, pero permite que se le apliquen dimensiones y márgenes*/
            width: 300px;
            height: 200px;
            background-color: #c5f3cf;
            border: 1px solid #34d14e;
        }

        .box {
            width: 250px;
            height: 50px;
            background-color: #3498db;
            border: 1px solid #2980b9;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #One {
            position: absolute; 
            top: 70px; /* desplaza el elemento hacia abajo */
            left: 80px;/* desplaza el elemento hacia la derecha */
            right: 20px; /* desplaza el elemento hacia la izquierda */
            bottom: 20px; /* desplaza el elemento hacia arriba */
        }
        #Two {
            position: relative; 
            top: 70px; /* desplaza el elemento hacia abajo */
            left: 80px;/* desplaza el elemento hacia la derecha */
            right: 20px; /* desplaza el elemento hacia la izquierda */
            bottom: 20px; /* desplaza el elemento hacia arriba */
        }
        #Three {
            position: static; 
        }
        #Four {
            position: fixed; 
            top: 150px; /* desplaza el elemento hacia abajo */
            left: 20px;/* desplaza el elemento hacia la derecha */
            right: 20px; /* desplaza el elemento hacia la izquierda */
            bottom: 20px; /* desplaza el elemento hacia arriba */
        }
        #Five {
            position: sticky; 
            top: 150px; /* desplaza el elemento hacia abajo */
            left: 120px;/* desplaza el elemento hacia la derecha */
            right: 20px; /* desplaza el elemento hacia la izquierda */
            bottom: 20px; /* desplaza el elemento hacia arriba */
        }

        
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            <div class="box" id="One">1</div>
            <div class="box" id="Two">2</div>
            <div class="box" id="Three">3</div>
            <div class="box" id="Four">4</div>
            <div class="box" id="Five">5</div>
        </div>
    </div>
</body>
</html>
