<!--
Los selectores combinadores en CSS permiten seleccionar elementos basados en su relación con otros elementos en el DOM. Estos selectores son útiles para aplicar estilos a elementos específicos 
que cumplen ciertas condiciones de relación.
# combinadores
    Descendiente (espacio): selecciona todos los elementos que son descendientes de un elemento específico. Por ejemplo, "div p" selecciona todos los <p> que están dentro de un <div>.
    Hijo directo (>): selecciona todos los elementos que son hijos directos de un elemento específico. Por ejemplo, "div > p" selecciona todos los <p> que son hijos directos de un <div>.
    Adyacente (+): selecciona el primer elemento que es adyacente a otro elemento. Por ejemplo, "h1 + p" selecciona el primer <p> que sigue inmediatamente después de un <h1>.
    Hermano general (~): selecciona todos los elementos que son hermanos de un elemento específico. Por ejemplo, "h1 ~ p" selecciona todos los <p> que son hermanos de un <h1>.
    universal (*): selecciona todos los elementos en el documento. Por ejemplo, "*" selecciona todos los elementos.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Selecciona CUALQUIER etiqueta que esté dentro de .conteiner */
        .conteiner * {
        border: 1px dashed red;
        color: purple;
        }
        /* 1. Combinador Descendiente (Espacio " ")
        Afecta a CUALQUIER <p> que esté dentro de .conteiner (hijos, nietos, bisnietos...). */
        .conteiner p {
        color: #333;
        }

        /* 2. Combinador de Hijo Directo (Signo mayor que ">")
        Afecta ÚNICAMENTE a los <p> que son hijos directos (primer nivel) de .conteiner.
        (El Párrafo 2 de la box interna se salva porque está más adentro). */
        .conteiner > p {
        font-weight: bold;
        }

        /* 3. Combinador de Hermano Adyacente (Signo más "+")
        Afecta al PRIMER elemento <p> que esté inmediatamente después de .box. */
        .box + p {
        color: red;
        }

        /* 4. Combinador de Hermanos Generales (Virgulilla "~")
        Afecta a TODOS los <p> que sean hermanos y estén después de .box. */
        .box ~ p {
        background-color: lightgray;
        }
                
    </style>
</head>
<body>
    <div class="conteiner">
        <h1>Título principal</h1>
        <p>Párrafo 1 (hijo directo de .conteiner)</p>
        
        <div class="box">
            <p>Párrafo 2 (está dentro de .box, pero es nieto de .conteiner)</p>
        </div>

        <p>Párrafo 3 (hermano directo, viene justo después de .box)</p>
        <p>Párrafo 4 (hermano general de .box)</p>
    </div>
</body>
</html>
