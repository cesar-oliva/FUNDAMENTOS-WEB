<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card {
            margin: 20px auto;
            position: relative;
            top: 0%;
            width: 240px;
            padding: 20px;
            border-radius: 14px;
            background-color: #eec9c9;
            border: 1px solid #fdfbfc;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            color: #5a1236;
            cursor: pointer;
            transition: top 0.4s ease;
        }

        .card:hover {
            top: -10px;
        }


        .card h3 {
            margin: 0 0 6px;
        }

        .card p {
            margin: 0;
            color: #a0476c;
        }
    </style>


</head>
<body>
    <div class="card">
        <h3>Welcome to My Website</h3>
        <p>This is a simple card layout.</p>
    </div>
</body>
</html>
